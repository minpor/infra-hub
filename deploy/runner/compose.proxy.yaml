name: infra-hub-dependencies
services:
  proxy:
    image: infra-hub-dependency-proxy:local
    build:
      context: .
      dockerfile: Dockerfile.proxy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    volumes: ["dependency_proxy:/proxy"]
volumes:
  dependency_proxy:
    name: infra-hub-dependency-proxy
