name: infra-hub-local
services:
  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_DB: infra_hub
      POSTGRES_USER: infra_hub
      POSTGRES_PASSWORD: ${HUB_DATABASE_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra_hub -d infra_hub"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
