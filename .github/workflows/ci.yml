name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install PostgreSQL server tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - name: Install frontend and browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Backend, UI and restart scenarios
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: ./scripts/check.sh
      - name: Dependency proxy checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate community Compose configuration
        run: |
          docker compose --env-file deploy/self-host/.env.example -f deploy/self-host/compose.yaml config --quiet
          docker compose --env-file deploy/self-host/.env.example -f deploy/self-host/compose.yaml -f deploy/self-host/compose.runner.yaml config --quiet
