name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install PostgreSQL server tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
      - name: Install frontend and browser dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Backend, UI and restart scenarios
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: ./scripts/check.sh
      - name: Dependency proxy checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate community Compose configuration
        run: |
          docker compose --env-file deploy/self-host/.env.example -f deploy/self-host/compose.yaml config --quiet
          docker compose --env-file deploy/self-host/.env.example -f deploy/self-host/compose.yaml -f deploy/self-host/compose.runner.yaml config --quiet
